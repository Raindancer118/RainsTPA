name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated from the commits since the previous tag, which needs more
          # than the default shallow clone.
          fetch-depth: 0

      # Paper 26.2 ships class files at version 69, i.e. Java 25, and requires it at runtime.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Read the version out of the pom once and reuse it everywhere, so the jar name, the release
      # title and the tag check can never disagree about what is being built.
      - name: Read the project version
        id: version
        run: |
          VERSION="$(mvn --batch-mode --quiet -DforceStdout help:evaluate -Dexpression=project.version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "jar=target/RainsTPA-$VERSION.jar" >> "$GITHUB_OUTPUT"
          echo "Building RainsTPA $VERSION"

      # Checked before anything is built, let alone published: a jar whose name disagrees with the
      # release it hangs off is worse than a failed build.
      - name: Check the tag matches the pom version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${{ steps.version.outputs.version }}" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the pom version ${{ steps.version.outputs.version }}."
            echo "Bump <version> in pom.xml, or retag, so the jar matches the release."
            exit 1
          fi

      # Whether this pom version already has a tag on the remote — the switch that lets a plain
      # version bump on main publish on its own, instead of silently building a jar nobody can
      # install as a fixed version until somebody remembers to push a matching tag by hand.
      - name: Check whether vVERSION is already tagged
        id: tagcheck
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" \
              >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

      # Fails loudly when the jar is not where the version said it would be, rather than letting an
      # empty release be published.
      - name: Verify the jar
        id: jar
        run: |
          JAR="${{ steps.version.outputs.jar }}"
          test -f "$JAR" || { echo "::error::$JAR was not produced."; exit 1; }
          SHA="$(sha256sum "$JAR" | cut -d' ' -f1)"
          SIZE="$(du -h "$JAR" | cut -f1)"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA  $(basename "$JAR")" > "$JAR.sha256"
          {
            echo "### RainsTPA ${{ steps.version.outputs.version }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Jar | \`$(basename "$JAR")\` ($SIZE) |"
            echo "| SHA-256 | \`$SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: RainsTPA-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.version.outputs.jar }}
            ${{ steps.version.outputs.jar }}.sha256

      # Every push to main republishes a rolling "latest", so there is always one link to the newest
      # build without needing a tag. Marked pre-release: it is whatever main happens to be.
      - name: Publish rolling "latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' \
            "Automatic build from main @ \`${{ github.sha }}\`." \
            "" \
            "**This is not a release** — it is whatever main currently is." \
            "For a fixed version, use a tagged release." \
            "" \
            "\`sha256: ${{ steps.jar.outputs.sha256 }}\`" > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "${{ steps.version.outputs.jar }}" \
            "${{ steps.version.outputs.jar }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "Latest build (${{ steps.version.outputs.version }})" \
            --notes-file notes.md \
            --prerelease

      # A pushed vX.Y.Z tag cuts the permanent, versioned release.
      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tagcheck.outputs.new == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.jar.outputs.sha256 }}
        run: |
          printf '%s\n' \
            "Teleport requests that ask first: /tpa, /tpahere, /back — and a menu for all of it." \
            "" \
            "### Installing" \
            "" \
            "Drop \`RainsTPA-${VERSION}.jar\` into \`plugins/\` and restart. Nothing else is" \
            "needed: every player may ask, nobody is teleported without agreeing, and how long a" \
            "request stands, the warmup and \`/back\` are all in \`config.yml\`." \
            "" \
            "Already running **Rain's SMP Core**? This plugin is folded into it as the \`tpa\`" \
            "module — install one or the other, not both." \
            "" \
            "\`sha256: ${SHA256}\`" \
            "" \
            "---" > notes.md
          gh release create "$TAG" \
            "${{ steps.version.outputs.jar }}" \
            "${{ steps.version.outputs.jar }}.sha256" \
            --repo "${{ github.repository }}" \
            --title "RainsTPA ${VERSION}" \
            --notes-file notes.md \
            --generate-notes

      # Tagged only now that the release above has actually succeeded — not before it, so a failed
      # release leaves no tag behind and gets retried on the next push instead of being silently
      # marked done. A tag pushed here with the default GITHUB_TOKEN does not retrigger this
      # workflow (GitHub's own recursion guard), which is why the release runs in *this* job rather
      # than waiting for that retrigger.
      - name: Tag this version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tagcheck.outputs.new == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
